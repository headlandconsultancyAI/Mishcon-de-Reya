name: Update dashboard

on:
  repository_dispatch:           # Apify calls this when the Monday scrape finishes
    types: [apify-run]
  schedule:
    - cron: "30 10 * * 1"        # backup: Mondays 10:30 UTC, in case the webhook doesn't fire
  workflow_dispatch:             # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest scrape and build
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          DATASET_ID: ${{ github.event.client_payload.datasetId }}
        run: python build.py

      - name: Save post history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/meta.json
          if git diff --cached --quiet; then
            echo "No new data to save"
          else
            git commit -m "Weekly data refresh $(date -u +'%Y-%m-%d')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
